<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-label="Proyectos en producción">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050E24"/>
      <stop offset="0.6" stop-color="#0B2A6B"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93C5FD" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="72" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
    .in { animation: up .7s ease-out backwards; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .shine { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-320px); } 45%, 100% { transform: translateX(1520px); } }
    .line { transform-box: fill-box; transform-origin: left; animation: grow 1.1s .3s cubic-bezier(.2,.8,.2,1) backwards; }
    @keyframes grow { from { transform: scaleX(0); } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="72" fill="url(#bg)"/>
    <rect width="1200" height="72" fill="url(#grid)"/>
    <rect class="shine" x="0" y="0" width="260" height="72" fill="url(#shine)" transform="translate(-320 0)"/>
    <rect x="0" y="0" width="6" height="72" fill="url(#accent)"/>
    <text class="mono in" x="34" y="46" fill="#22D3EE" font-size="22" font-weight="700">02</text>
    <text class="sans in" x="80" y="46" fill="#FFFFFF" font-size="27" font-weight="700" style="animation-delay:.1s">Proyectos en producción</text>
    <rect class="line" x="455" y="35" width="705" height="2" rx="1" fill="url(#accent)" opacity=".55"/>
  </g>
</svg>
