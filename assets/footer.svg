<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="¿Tienes un proyecto en mente? Escríbeme a luisacudev@gmail.com">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050E24"/>
      <stop offset="0.6" stop-color="#0B2A6B"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93C5FD" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="190" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
    .in { animation: up .7s ease-out backwards; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .w1 { animation: slide 12s linear infinite; }
    .w2 { animation: slide 8s linear infinite reverse; }
    @keyframes slide { to { transform: translateX(-600px); } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="190" fill="url(#bg)"/>
    <rect width="1200" height="190" fill="url(#grid)"/>
    <path class="w1" d="M0 140 C150.0 126 150.0 126 300.0 140 S450.0 154 600 140 C750.0 126 750.0 126 900.0 140 S1050.0 154 1200 140 C1350.0 126 1350.0 126 1500.0 140 S1650.0 154 1800 140 V200 H0 Z" fill="#1D4ED8" fill-opacity=".55"/>
    <g transform="translate(-300 0)"><path class="w2" d="M0 156 C150.0 146 150.0 146 300.0 156 S450.0 166 600 156 C750.0 146 750.0 146 900.0 156 S1050.0 166 1200 156 C1350.0 146 1350.0 146 1500.0 156 S1650.0 166 1800 156 V200 H0 Z" fill="#3B82F6" fill-opacity=".45"/></g>
    <g class="sans" text-anchor="middle">
      <text class="in" x="600" y="64" fill="#FFFFFF" font-size="28" font-weight="700">¿Tienes un proyecto en mente?</text>
      <text class="in" x="600" y="100" fill="#93C5FD" font-size="19" style="animation-delay:.2s">Escríbeme a luisacudev@gmail.com</text>
    </g>
  </g>
</svg>
